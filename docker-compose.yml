services:
  db-test:
    image: postgres:16-alpine
    container_name: realworld-db-test
    environment:
      POSTGRES_USER: rw
      POSTGRES_PASSWORD: rw
      POSTGRES_DB: realworld_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rw -d realworld_test"]
      interval: 1s
      timeout: 3s
      retries: 30
